<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 종이 카드 배경 + hairline 테두리 (브랜드 톤) -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#fafaf7" stroke="#e6e4de"/>
  <!-- 사계절 컬러 스와치: 왼쪽=웜 / 오른쪽=쿨, 위=라이트 / 아래=딥 -->
  <!-- 봄 (웜·라이트) -->
  <rect x="5" y="5" width="10" height="10" rx="2.5" fill="#ffb088"/>
  <!-- 여름 (쿨·라이트) -->
  <rect x="17" y="5" width="10" height="10" rx="2.5" fill="#e7a6c4"/>
  <!-- 가을 (웜·딥) -->
  <rect x="5" y="17" width="10" height="10" rx="2.5" fill="#c68a3e"/>
  <!-- 겨울 (쿨·딥) -->
  <rect x="17" y="17" width="10" height="10" rx="2.5" fill="#3f5bc4"/>
</svg>
